[project]
name = "polymarket-research-kit"
version = "0.1.0"
description = "Research toolkit for Polymarket: data loaders, execution-realistic backtests and calibration scans."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nikita Yastreb" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "polars>=1.44",
    "scipy>=1.13",
    "tenacity>=9.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9"]
weather = ["eccodes>=2.40", "eccodeslib>=2.40", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
pmrk = "pmrk.cli:main"

[project.urls]
Repository = "https://github.com/zee229/polymarket-research-kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmrk"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: hits live public APIs (skipped by default; run with -m network)",
    "weather: needs the [weather] extra",
]
